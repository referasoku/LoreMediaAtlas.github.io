<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LoreVault</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Supabase SDK & Bad Words Filter -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bad-words@3.0.4/lib/badwords.min.js"></script>
</head>
<body>

  <main class="container" style="max-width: 400px; margin-top: 5rem;">
    <h1 style="text-align: center;">LoreVault</h1>
    <p style="text-align: center; margin-bottom: 2rem;">Sign in or create an account to access reviews.</p>

    <!-- Navigation Tabs without inline onclick handlers -->
    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
      <button id="showLoginBtn" class="tab-btn active" style="flex: 1;">Sign In</button>
      <button id="showSignupBtn" class="tab-btn" style="flex: 1;">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-input" required>
      </div>
      <button type="submit" class="btn-submit" style="width: 100%;">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signupForm" style="display: none;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signupUsername" class="form-input" placeholder="e.g. MovieBuff99" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" class="form-input" required minlength="6">
      </div>
      <button type="submit" class="btn-submit" style="width: 100%;">Create Account</button>
    </form>

    <p id="authError" style="color: #ef4444; margin-top: 1rem; text-align: center;"></p>
  </main>

  <script>
    const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initialize Profanity Filter & Reserved Names
    const filter = new Filter();
    const reservedNames = ['admin', 'administrator', 'mod', 'moderator', 'lorevault', 'system', 'support', 'root'];

    // DOM Elements
    const showLoginBtn = document.getElementById('showLoginBtn');
    const showSignupBtn = document.getElementById('showSignupBtn');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const errorDisplay = document.getElementById('authError');

    let mode = 'login';

    // Clean Toggle Handler without inline HTML execution
    function switchMode(selectedMode) {
      mode = selectedMode;
      loginForm.style.display = mode === 'login' ? 'block' : 'none';
      signupForm.style.display = mode === 'signup' ? 'block' : 'none';
      showLoginBtn.classList.toggle('active', mode === 'login');
      showSignupBtn.classList.toggle('active', mode === 'signup');
      errorDisplay.textContent = '';
    }

    // Attach Event Listeners Safely
    showLoginBtn.addEventListener('click', () => switchMode('login'));
    showSignupBtn.addEventListener('click', () => switchMode('signup'));

    // Front-End Username Validation Function
    function isValidUsername(username) {
      errorDisplay.textContent = '';

      if (username.length < 3 || username.length > 20) {
        errorDisplay.textContent = 'Username must be between 3 and 20 characters.';
        return false;
      }

      const validPattern = /^[a-zA-Z0-9_]+$/;
      if (!validPattern.test(username)) {
        errorDisplay.textContent = 'Username can only contain letters, numbers, and underscores.';
        return false;
      }

      if (reservedNames.includes(username.toLowerCase())) {
        errorDisplay.textContent = 'This username is reserved. Please choose another.';
        return false;
      }

      if (filter.isProfane(username)) {
        errorDisplay.textContent = 'Username contains inappropriate language. Please choose another.';
        return false;
      }

      return true;
    }

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDisplay.textContent = '';

      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');

      const email = emailInput ? emailInput.value.trim().toLowerCase() : '';
      const password = passwordInput ? passwordInput.value : '';

      if (!email || !password) {
        errorDisplay.textContent = 'Please enter both email and password.';
        return;
      }

      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });

        if (error) {
          errorDisplay.textContent = error.message;
          return;
        }

        // Direct browser location swap
        window.location.replace('index.html');

      } catch (err) {
        console.error('Login error:', err);
        errorDisplay.textContent = 'An unexpected error occurred. Please try again.';
      }
    });

    // Handle Sign Up
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      if (!isValidUsername(username)) {
        return;
      }

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) {
        errorDisplay.textContent = error.message;
      } else {
        alert('Account created! Logging you in...');
        window.location.replace('index.html');
      }
    });
  </script>
</body>
</html>
