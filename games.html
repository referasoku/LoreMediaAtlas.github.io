<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - LoreVault</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreVault</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="games.html" class="active">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <h1>Game Catalog</h1>
      <input type="text" id="gameSearch" class="search-input" placeholder="search for a game...">

      <div id="gameGrid" class="card-grid">
        <!-- Search results will appear here -->
      </div>
    </main>

    <script>
      // Supabase Edge Function Configuration
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      const searchInput = document.getElementById('gameSearch');
      const gameGrid = document.getElementById('gameGrid');

      searchInput.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        if (query.length < 2) {
          gameGrid.innerHTML = '';
          return;
        }

        try {
          // Call your Supabase Edge Function for IGDB games
          const response = await fetch(`${SUPABASE_URL}/igdb-games?query=${encodeURIComponent(query)}`, {
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const games = await response.json();

          gameGrid.innerHTML = games.map(game => `
            <div class="card">
              <img src="${game.cover_url ? game.cover_url : 'https://via.placeholder.com/200x300'}" alt="${game.name}">
              <h3>${game.name}</h3>
              <p>Rating: ⭐ ${game.rating ? (game.rating / 20).toFixed(1) : 'N/A'}</p>
              <a href="review.html?id=${game.id}&type=game" class="btn-review">Reviews & Ratings</a>
            </div>
          `).join('');
        } catch (err) {
          console.error('Error fetching games:', err);
          gameGrid.innerHTML = '<p class="error">Unable to load games at this time.</p>';
        }
      });
    </script>
  </body>
</html>
