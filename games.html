<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - LoreMediaAtlas</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreMediaAtlas</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="games.html" class="active">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <h1>Game Catalog</h1>
      <input type="text" id="gameSearch" class="search-input" placeholder="Search for a game...">

      <div id="gameGrid" class="card-grid">
        <p>Loading games...</p>
      </div>
    </main>

    <script>
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      const searchInput = document.getElementById('gameSearch');
      const gameGrid = document.getElementById('gameGrid');

      let debounceTimeout;

      function formatHalfStarRating(ratingOutOfFive) {
        if (ratingOutOfFive === null || ratingOutOfFive === undefined || isNaN(ratingOutOfFive)) {
          return 'N/A';
        }
        const clamped = Math.max(0, Math.min(5, ratingOutOfFive));
        const halfStarRounded = (Math.round(clamped * 2) / 2).toFixed(1);
        return `${halfStarRounded} / 5`;
      }

      async function fetchGames(query = '') {
        try {
          const endpoint = `${SUPABASE_URL}/igdb-games?query=${encodeURIComponent(query)}`;

          const response = await fetch(endpoint, {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (!response.ok) {
            const errPayload = await response.text();
            throw new Error(`Server error (${response.status}): ${errPayload}`);
          }

          const games = await response.json();
          renderGames(games);
        } catch (err) {
          console.error('Error fetching games:', err);
          gameGrid.innerHTML = '<p class="error">Unable to load games at this time.</p>';
        }
      }

      function renderGames(games) {
        if (!games || games.length === 0) {
          gameGrid.innerHTML = '<p>No games found matching your search.</p>';
          return;
        }

        gameGrid.innerHTML = games.map(game => {
          // IGDB ratings are 0-100; divide by 20 to scale to 0-5
          const ratingOutOfFive = game.rating ? game.rating / 20 : null;
          const formattedRating = formatHalfStarRating(ratingOutOfFive);

          // Handle nested cover object or fallback placeholder
          const coverImage = (game.cover && game.cover.url) 
            ? game.cover.url 
            : 'https://via.placeholder.com/200x300?text=No+Cover';

          const title = escapeHtml(game.name || 'Untitled');

          return `
            <div class="card">
              <img src="${coverImage}" alt="${title}">
              <h3>${title}</h3>
              <p>Rating: ⭐ ${formattedRating}</p>
              <a href="review.html?id=${game.id}&type=game" class="btn-review">Reviews & Ratings</a>
            </div>
          `;
        }).join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(//>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Input Listener with Debounce (300ms delay)
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimeout);
        const query = e.target.value.trim();

        debounceTimeout = setTimeout(() => {
          fetchGames(query);
        }, 300);
      });

      // Fetch top-rated games when page loads
      document.addEventListener('DOMContentLoaded', () => {
        fetchGames('');
      });
    </script>
  </body>
</html>
