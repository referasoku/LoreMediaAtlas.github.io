<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - LoreMediaAtlas</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase SDK & Auth Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <header>
    <h2>LoreMediaAtlas</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="games.html">Games</a>
      <a href="feed.html">Feed</a>
      <a href="users.html">Users</a>
      <a href="account.html" class="active">Account</a>
    </nav>
  </header>

  <main class="container">
    <h1 id="profileHeader">My Profile</h1>
    <p style="margin-bottom: 2rem;">Manage and view submitted reviews.</p>

    <!-- Tab Selection -->
    <div class="tab-container" style="margin-bottom: 1.5rem;">
      <button class="tab-btn active" id="movieTabBtn">Movie Reviews</button>
      <button class="tab-btn" id="gameTabBtn">Game Reviews</button>
    </div>

    <!-- Review Stream -->
    <div id="userReviewsList">
      <p>Loading reviews...</p>
    </div>
  </main>

  <script>
    let activeTab = 'movie';
    let isInitialized = false;

    // Parse URL Parameters (?user=Username)
    const urlParams = new URLSearchParams(window.location.search);
    const viewedUser = urlParams.get('user');

    // DOM Elements
    const movieTabBtn = document.getElementById('movieTabBtn');
    const gameTabBtn = document.getElementById('gameTabBtn');
    const userReviewsList = document.getElementById('userReviewsList');
    const profileHeader = document.getElementById('profileHeader');

    // Tab Listeners
    movieTabBtn.addEventListener('click', () => switchTab('movie'));
    gameTabBtn.addEventListener('click', () => switchTab('game'));

    function switchTab(type) {
      activeTab = type;
      movieTabBtn.classList.toggle('active', type === 'movie');
      gameTabBtn.classList.toggle('active', type === 'game');

      const targetUsername = getTargetUsername();
      if (targetUsername) {
        fetchUserReviews(targetUsername);
      }
    }

    function getTargetUsername() {
      if (viewedUser) return viewedUser;
      if (typeof currentUserProfile !== 'undefined' && currentUserProfile) {
        return currentUserProfile.username;
      }
      return null;
    }

    function renderRatingStars(rating) {
      if (rating === null || rating === undefined) return 'N/A';
      const num = parseFloat(rating);
      return `⭐ ${num.toFixed(1)} / 5`;
    }

    async function fetchUserReviews(username) {
      userReviewsList.innerHTML = '<p>Loading reviews...</p>';

      try {
        const { data: reviews, error } = await db
          .from('reviews')
          .select('*')
          .eq('username', username)
          .eq('item_type', activeTab)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!reviews || reviews.length === 0) {
          userReviewsList.innerHTML = `<p>No ${activeTab} reviews posted yet by @${escapeHtml(username)}.</p>`;
          return;
        }

        userReviewsList.innerHTML = reviews.map(r => `
          <div class="review-card" style="display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1rem; background: var(--card-bg, #1e293b); padding: 1rem; border-radius: 8px;">
            ${r.item_image ? `<img src="${escapeHtml(r.item_image)}" alt="${escapeHtml(r.item_title || '')}" style="width: 70px; height: 100px; object-fit: cover; border-radius: 6px;">` : ''}
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">
                <h3 style="margin: 0;">${escapeHtml(r.item_title || 'Untitled')}</h3>
                <span style="color: #f59e0b; font-weight: bold;">${renderRatingStars(r.rating)}</span>
              </div>
              <p style="margin: 0.5rem 0;">${escapeHtml(r.comment || r.review_text || '')}</p>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <small style="color: gray;">Posted ${new Date(r.created_at).toLocaleDateString()}</small>
                <a href="review.html?id=${encodeURIComponent(r.item_id)}&type=${encodeURIComponent(r.item_type)}" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem;">View Item Page →</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Fetch error:', err);
        userReviewsList.innerHTML = '<p class="error">Error loading reviews.</p>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function initAccountPage() {
      if (isInitialized) return;
      
      const targetUsername = getTargetUsername();

      if (targetUsername) {
        isInitialized = true;
        profileHeader.textContent = `@${targetUsername}'s Profile`;
        fetchUserReviews(targetUsername);
      } else {
        userReviewsList.innerHTML = '<p>User profile not found. Please log in.</p>';
      }
    }

    // 1. Listen for authReady event if auth.js finishes AFTER script load
    window.addEventListener('authReady', () => {
      initAccountPage();
    });

    // 2. Immediate check on DOMContentLoaded if auth.js finished BEFORE script load
    document.addEventListener('DOMContentLoaded', () => {
      if (viewedUser || (typeof currentUserProfile !== 'undefined' && currentUserProfile)) {
        initAccountPage();
      }
    });
  </script>
</body>
</html>
