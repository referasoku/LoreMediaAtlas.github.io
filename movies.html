<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies - LoreMediaAtlas</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreMediaAtlas</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html" class="active">Movies</a>
        <a href="games.html">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <h1>Movie Catalog</h1>
      <input type="text" id="movieSearch" class="search-input" placeholder="Search for a movie...">

      <div id="movieGrid" class="card-grid">
        <p>Loading movies...</p>
      </div>
    </main>

    <script>
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      // ✅ Restored valid key matching games.html
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      const searchInput = document.getElementById('movieSearch');
      const movieGrid = document.getElementById('movieGrid');

      let debounceTimeout;

      function formatHalfStarRating(voteAverage) {
        if (voteAverage === null || voteAverage === undefined || isNaN(voteAverage)) {
          return 'N/A';
        }
        const ratingOutOfFive = voteAverage / 2;
        const clamped = Math.max(0, Math.min(5, ratingOutOfFive));
        const halfStarRounded = (Math.round(clamped * 2) / 2).toFixed(1);
        return `${halfStarRounded} / 5`;
      }

      async function fetchMovies(query = '') {
        try {
          const endpoint = `${SUPABASE_URL}/tmdb-movies?query=${encodeURIComponent(query)}`;

          const response = await fetch(endpoint, {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || `Server status ${response.status}`);
          }

          if (data.error) {
            throw new Error(data.error);
          }

          renderMovies(Array.isArray(data) ? data : []);
        } catch (err) {
          console.error('Error fetching movies:', err.message);
          movieGrid.innerHTML = `<p class="error">Error loading movies: ${escapeHtml(err.message)}</p>`;
        }
      }

      function renderMovies(movies) {
        if (!movies || movies.length === 0) {
          movieGrid.innerHTML = '<p>No movies found matching your search.</p>';
          return;
        }

        movieGrid.innerHTML = movies.map(movie => {
          const formattedRating = formatHalfStarRating(movie.vote_average);

          const posterImage = movie.poster_path 
            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
            : 'https://via.placeholder.com/200x300?text=No+Poster';

          const title = escapeHtml(movie.title || movie.original_title || 'Untitled');

          return `
            <div class="card">
              <img src="${posterImage}" alt="${title}">
              <h3>${title}</h3>
              <p>Rating: ⭐ ${formattedRating}</p>
              <a href="review.html?id=${movie.id}&type=movie" class="btn-review">Reviews & Ratings</a>
            </div>
          `;
        }).join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimeout);
        const query = e.target.value.trim();

        debounceTimeout = setTimeout(() => {
          fetchMovies(query);
        }, 300);
      });

      document.addEventListener('DOMContentLoaded', () => {
        fetchMovies('');
      });
    </script>
  </body>
</html>
