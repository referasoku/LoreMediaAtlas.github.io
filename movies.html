<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies - LoreVault</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreVault</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html" class="active">Movies</a>
        <a href="games.html">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <h1>Movie Catalog</h1>
      <input type="text" id="movieSearch" class="search-input" placeholder="search for a movie...">

      <div id="movieGrid" class="card-grid">
        <!-- Search results will appear here -->
      </div>
    </main>

    <script>
      // Supabase Edge Function Configuration
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      const searchInput = document.getElementById('movieSearch');
      const movieGrid = document.getElementById('movieGrid');

      searchInput.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        if (query.length < 2) {
          movieGrid.innerHTML = '';
          return;
        }

        try {
          // Call your Supabase Edge Function instead of TMDB directly
          const response = await fetch(`${SUPABASE_URL}/tmdb-movies?query=${encodeURIComponent(query)}`, {
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const data = await response.json();
          const results = data.results || data; // Handles both raw TMDB search arrays or custom normalized output

          movieGrid.innerHTML = results.map(movie => `
            <div class="card">
              <img src="${movie.poster_path ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path : 'https://via.placeholder.com/200x300'}" alt="${movie.title}">
              <h3>${movie.title}</h3>
              <p>Rating: ⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</p>
              <a href="review.html?id=${movie.id}&type=movie" class="btn-review">Reviews & Ratings</a>
            </div>
          `).join('');
        } catch (err) {
          console.error('Error fetching movies:', err);
          movieGrid.innerHTML = '<p class="error">Unable to load movies at this time.</p>';
        }
      });
    </script>
  </body>
</html>
