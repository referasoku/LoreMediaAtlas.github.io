<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies - LoreVault</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreVault</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html" class="active">Movies</a>
        <a href="games.html">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <h1>Movie Catalog</h1>
      <input type="text" id="movieSearch" class="search-input" placeholder="Search for a movie...">

      <div id="movieGrid" class="card-grid">
        <p>Loading movies...</p>
      </div>
    </main>

    <script>
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      const searchInput = document.getElementById('movieSearch');
      const movieGrid = document.getElementById('movieGrid');

      // Debounce utility to reduce rate limits during typing
      let debounceTimeout;

      async function fetchMovies(query = '') {
        try {
          // Send both query param and headers required by Supabase
          const endpoint = `${SUPABASE_URL}/tmdb-movies?query=${encodeURIComponent(query)}`;
          
          const response = await fetch(endpoint, {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (!response.ok) {
            const errorPayload = await response.text();
            throw new Error(`Server status ${response.status}: ${errorPayload}`);
          }

          const data = await response.json();
          // Extract array depending on whether function wraps response in data or results
          const movies = Array.isArray(data) ? data : (data.results || []);

          renderMovies(movies);
        } catch (err) {
          console.error('Error fetching movies:', err);
          movieGrid.innerHTML = '<p class="error">Unable to load movies at this time.</p>';
        }
      }

      function renderMovies(movies) {
        if (!movies || movies.length === 0) {
          movieGrid.innerHTML = '<p>No movies found matching your search.</p>';
          return;
        }

        movieGrid.innerHTML = movies.map(movie => {
          const posterUrl = movie.poster_path 
            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
            : 'https://via.placeholder.com/200x300?text=No+Poster';

          const title = escapeHtml(movie.title || 'Untitled');
          const rating = movie.vote_average ? (movie.vote_average / 2).toFixed(1) : 'N/A';

          return `
            <div class="card">
              <img src="${posterUrl}" alt="${title}">
              <h3>${title}</h3>
              <p>Rating: ⭐ ${rating} / 5</p>
              <a href="review.html?id=${movie.id}&type=movie" class="btn-review">Reviews & Ratings</a>
            </div>
          `;
        }).join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Input Listener with Debounce
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimeout);
        const query = e.target.value.trim();

        debounceTimeout = setTimeout(() => {
          fetchMovies(query);
        }, 300);
      });

      // Fetch initial popular list on load
      document.addEventListener('DOMContentLoaded', () => {
        fetchMovies('');
      });
    </script>
  </body>
</html>
