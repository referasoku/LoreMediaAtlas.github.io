<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Ratings - LoreMediaAtlas</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreMediaAtlas</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="games.html">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <!-- Dynamic Back Navigation Button -->
      <div style="margin-bottom: 1.5rem;">
        <button id="backBtn" class="btn" style="background-color: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 0.5rem 1rem; cursor: pointer; border-radius: 6px;">
          ← Back
        </button>
      </div>

      <div id="mediaDetails" class="details-container">
        <!-- Media info (poster, title, description) renders here -->
      </div>

      <section class="review-section">
        <h3>Leave a Review</h3>
        
        <!-- Interactive Half-Star Component -->
        <div class="star-rating" id="starRating">
          <span class="star" data-value="1">
            <span class="star-half left" data-value="0.5"></span>
            <span class="star-half right" data-value="1.0"></span>
          </span>
          <span class="star" data-value="2">
            <span class="star-half left" data-value="1.5"></span>
            <span class="star-half right" data-value="2.0"></span>
          </span>
          <span class="star" data-value="3">
            <span class="star-half left" data-value="2.5"></span>
            <span class="star-half right" data-value="3.0"></span>
          </span>
          <span class="star" data-value="4">
            <span class="star-half left" data-value="3.5"></span>
            <span class="star-half right" data-value="4.0"></span>
          </span>
          <span class="star" data-value="5">
            <span class="star-half left" data-value="4.5"></span>
            <span class="star-half right" data-value="5.0"></span>
          </span>
        </div>
        <p>Selected Rating: <span id="ratingValue">0.0</span> / 5</p>

        <textarea id="reviewText" placeholder="Write your thoughts..."></textarea>
        <button id="submitReviewBtn" class="btn">Submit Review</button>
        <div id="statusMessage"></div>
      </section>

      <section class="community-reviews">
        <h3>Community Reviews</h3>
        <div id="reviewsList">
          <!-- Existing reviews render here -->
        </div>
      </section>
    </main>

    <script>
      // Supabase Configuration
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      // Parse URL Parameters (e.g., review.html?id=123&type=movie)
      const urlParams = new URLSearchParams(window.location.search);
      const mediaId = urlParams.get('id');
      const mediaType = urlParams.get('type'); // 'movie' or 'game'

      const backBtn = document.getElementById('backBtn');
      const mediaDetails = document.getElementById('mediaDetails');
      const starContainer = document.getElementById('starRating');
      const ratingDisplay = document.getElementById('ratingValue');
      const submitBtn = document.getElementById('submitReviewBtn');
      const reviewText = document.getElementById('reviewText');
      const statusMessage = document.getElementById('statusMessage');
      const stars = starContainer.querySelectorAll('.star');
      
      let selectedRating = 0;

      // 1. Dynamic Back Button Logic
      backBtn.addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(window.location.host)) {
          window.history.back();
        } else {
          window.location.href = mediaType === 'game' ? 'games.html' : 'movies.html';
        }
      });

      // 2. Fetch Media Info from Edge Function
      async function loadMediaDetails() {
        if (!mediaId || !mediaType) {
          mediaDetails.innerHTML = '<p class="error">Invalid media selection.</p>';
          return;
        }

        const endpoint = mediaType === 'movie' ? 'tmdb-movies' : 'igdb-games';

        try {
          const response = await fetch(`${SUPABASE_URL}/${endpoint}?id=${encodeURIComponent(mediaId)}`, {
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'apikey': SUPABASE_ANON_KEY
            }
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const media = await response.json();
          const item = Array.isArray(media) ? media[0] : media;
          renderDetails(item);
        } catch (err) {
          console.error('Error loading media details:', err);
          mediaDetails.innerHTML = '<p class="error">Unable to load details.</p>';
        }
      }

      // 3. Render Media Details Header
      function renderDetails(media) {
        if (!media) {
          mediaDetails.innerHTML = '<p class="error">Media info could not be found.</p>';
          return;
        }

        const title = escapeHtml(media.title || media.name || 'Untitled');
        const overview = escapeHtml(media.overview || media.summary || 'No description available.');
        const poster = media.poster_path 
          ? `https://image.tmdb.org/t/p/w500${media.poster_path}` 
          : (media.cover?.url ? media.cover.url.replace('t_thumb', 't_cover_big') : 'https://via.placeholder.com/200x300?text=No+Poster');

        mediaDetails.innerHTML = `
          <div class="details-card" style="display: flex; gap: 2rem; margin-bottom: 2rem;">
            <img src="${poster}" alt="${title}" style="width: 200px; border-radius: 8px; object-fit: cover;">
            <div class="details-info">
              <h2>${title}</h2>
              <p><strong>Type:</strong> ${mediaType ? mediaType.toUpperCase() : ''}</p>
              <p>${overview}</p>
            </div>
          </div>
        `;
      }

      // 4. Half-Star Rating Logic
      function renderStars(rating) {
        stars.forEach((star, index) => {
          const starValue = index + 1;
          star.classList.remove('full', 'half');

          if (rating >= starValue) {
            star.classList.add('full');
          } else if (rating >= starValue - 0.5) {
            star.classList.add('half');
          }
        });
      }

      starContainer.addEventListener('mousemove', (e) => {
        if (e.target.classList.contains('star-half')) {
          const hoverValue = parseFloat(e.target.dataset.value);
          renderStars(hoverValue);
          ratingDisplay.textContent = hoverValue.toFixed(1);
        }
      });

      starContainer.addEventListener('mouseleave', () => {
        renderStars(selectedRating);
        ratingDisplay.textContent = selectedRating.toFixed(1);
      });

      starContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('star-half')) {
          selectedRating = parseFloat(e.target.dataset.value);
          renderStars(selectedRating);
          ratingDisplay.textContent = selectedRating.toFixed(1);
        }
      });

      // 5. Submit Review Event Handler
      submitBtn.addEventListener('click', async () => {
        const content = reviewText.value.trim();

        if (selectedRating === 0) {
          statusMessage.innerHTML = '<p class="error">Please select a star rating.</p>';
          return;
        }

        if (!content) {
          statusMessage.innerHTML = '<p class="error">Please write a review comment.</p>';
          return;
        }

        statusMessage.innerHTML = '<p class="info">Submitting review...</p>';

        try {
          const response = await fetch(`https://tpeqgjgeeyrepaijdcuj.supabase.co/rest/v1/reviews`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'apikey': SUPABASE_ANON_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              media_id: mediaId,
              media_type: mediaType,
              rating: selectedRating,
              review_text: content
            })
          });

          if (!response.ok) throw new Error('Failed to save review');

          statusMessage.innerHTML = '<p class="success">Review submitted successfully!</p>';
          reviewText.value = '';
          selectedRating = 0;
          renderStars(0);
          ratingDisplay.textContent = '0.0';
        } catch (err) {
          console.error('Error submitting review:', err);
          statusMessage.innerHTML = '<p class="error">Failed to submit review. Try again later.</p>';
        }
      });

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Initialize page
      loadMediaDetails();
    </script>
  </body>
</html>
