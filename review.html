<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Ratings - LoreVault</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <header>
      <h2>LoreVault</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="games.html">Games</a>
        <a href="feed.html">Feed</a>
        <a href="users.html">Users</a>
        <a href="account.html">Account</a>
      </nav>
    </header>

    <main class="container">
      <div id="mediaDetails" class="details-container">
        <!-- Media info (poster, title, description) renders here -->
      </div>

      <section class="review-section">
        <h3>Leave a Review</h3>
        
        <!-- Interactive Half-Star Component -->
        <div class="star-rating" id="starRating">
          <span class="star" data-value="1">
            <span class="star-half left" data-value="0.5"></span>
            <span class="star-half right" data-value="1.0"></span>
          </span>
          <span class="star" data-value="2">
            <span class="star-half left" data-value="1.5"></span>
            <span class="star-half right" data-value="2.0"></span>
          </span>
          <span class="star" data-value="3">
            <span class="star-half left" data-value="2.5"></span>
            <span class="star-half right" data-value="3.0"></span>
          </span>
          <span class="star" data-value="4">
            <span class="star-half left" data-value="3.5"></span>
            <span class="star-half right" data-value="4.0"></span>
          </span>
          <span class="star" data-value="5">
            <span class="star-half left" data-value="4.5"></span>
            <span class="star-half right" data-value="5.0"></span>
          </span>
        </div>
        <p>Selected Rating: <span id="ratingValue">0.0</span> / 5</p>

        <textarea id="reviewText" placeholder="Write your thoughts..."></textarea>
        <button id="submitReviewBtn" class="btn">Submit Review</button>
      </section>
    </main>

    <script>
      // Supabase Edge Function Configuration
      const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co/functions/v1';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';

      // Parse URL Parameters (e.g., review.html?id=123&type=movie)
      const urlParams = new URLSearchParams(window.location.search);
      const mediaId = urlParams.get('id');
      const mediaType = urlParams.get('type'); // 'movie' or 'game'

      const mediaDetails = document.getElementById('mediaDetails');
      const starContainer = document.getElementById('starRating');
      const ratingDisplay = document.getElementById('ratingValue');
      const stars = starContainer.querySelectorAll('.star');
      let selectedRating = 0;

      // 1. Fetch Media Info from Edge Function
      async function loadMediaDetails() {
        if (!mediaId || !mediaType) {
          mediaDetails.innerHTML = '<p class="error">Invalid media selection.</p>';
          return;
        }

        const endpoint = mediaType === 'movie' ? 'tmdb-movies' : 'igdb-games';

        try {
          const response = await fetch(`${SUPABASE_URL}/${endpoint}?id=${encodeURIComponent(mediaId)}`, {
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const media = await response.json();
          renderDetails(media);
        } catch (err) {
          console.error('Error loading media details:', err);
          mediaDetails.innerHTML = '<p class="error">Unable to load details.</p>';
        }
      }

      // 2. Render Media Details Header
      function renderDetails(media) {
        const title = media.title || media.name;
        const poster = media.poster_path 
          ? `https://image.tmdb.org/t/p/w500${media.poster_path}` 
          : (media.cover_url || 'https://via.placeholder.com/200x300');
        const overview = media.overview || media.summary || 'No description available.';

        mediaDetails.innerHTML = `
          <div class="details-card">
            <img src="${poster}" alt="${title}">
            <div class="details-info">
              <h2>${title}</h2>
              <p>${overview}</p>
            </div>
          </div>
        `;
      }

      // 3. Half-Star Rating Logic
      function renderStars(rating) {
        stars.forEach((star, index) => {
          const starValue = index + 1;
          star.classList.remove('full', 'half');

          if (rating >= starValue) {
            star.classList.add('full');
          } else if (rating >= starValue - 0.5) {
            star.classList.add('half');
          }
        });
      }

      starContainer.addEventListener('mousemove', (e) => {
        if (e.target.classList.contains('star-half')) {
          const hoverValue = parseFloat(e.target.dataset.value);
          renderStars(hoverValue);
          ratingDisplay.textContent = hoverValue.toFixed(1);
        }
      });

      starContainer.addEventListener('mouseleave', () => {
        renderStars(selectedRating);
        ratingDisplay.textContent = selectedRating.toFixed(1);
      });

      starContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('star-half')) {
          selectedRating = parseFloat(e.target.dataset.value);
          renderStars(selectedRating);
          ratingDisplay.textContent = selectedRating.toFixed(1);
        }
      });

      // Load media data on page load
      loadMediaDetails();
    </script>
  </body>
</html>
